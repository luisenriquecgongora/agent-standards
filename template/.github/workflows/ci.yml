name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job runs scripts/verify.py, so CI and local runs execute the same checks.
# Setup steps for each stack go before "Verify" (standards.py new --stack adds them).
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # standards: stack setup steps

      - name: Verify
        run: python scripts/verify.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
