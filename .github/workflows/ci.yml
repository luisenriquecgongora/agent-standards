name: CI

on:
  push:
    branches: [main]
  pull_request:

# Repos created from the template (with every stack) must pass their own checks and
# match the template; check and sync must repair only the shared parts.
jobs:
  test:
    name: Template tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pytest pyyaml ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q tests
