# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem; major bumps get their own PR so breaking changes stay reviewable.
# Add one entry per package manager the repo uses (pip, npm, cargo, ...), e.g.:
#
#  - package-ecosystem: pip
#    directory: /
#    schedule: { interval: weekly, day: monday }
#    open-pull-requests-limit: 5
#    commit-message: { prefix: build, include: scope }
#    groups:
#      python:
#        update-types: [minor, patch]
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: build, include: scope }
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: build, include: scope }
    groups:
      node:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: ci }
    groups:
      actions:
        patterns: ["*"]
